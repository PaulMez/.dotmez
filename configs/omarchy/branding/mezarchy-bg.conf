# mezarchy_bg.sh configuration -- sourced by bash.
# Deployed to ~/.config/omarchy/branding/mezarchy-bg.conf by omarchy_install_branding.sh.
#
# Image names are bare scene names resolved under
# ~/.config/omarchy/branding/backgrounds/<name>.png; anything containing a "/"
# is used as a path (~ is expanded).

# --- timed rotation: `mezarchy_bg.sh rotate on` steps through these in order
ROTATE=(
    mezarchy-terminal
    mezarchy-rain
    mezarchy-skyline
    mezarchy-circuit
    mezarchy-horizon
    mezarchy-panes
)
ROTATE_MINUTES=15

# --- per-workspace: `mezarchy_bg.sh workspace on` swaps as you switch workspaces
# Hyprland workspace id -> image. Workspaces not listed use WORKSPACE_DEFAULT
# (leave it empty to keep whatever is showing when you land on one).
WORKSPACE[1]=mezarchy-terminal
WORKSPACE[2]=mezarchy-rain
WORKSPACE[3]=mezarchy-skyline
WORKSPACE[4]=mezarchy-circuit
WORKSPACE[5]=mezarchy-horizon
WORKSPACE[6]=mezarchy-panes
WORKSPACE_DEFAULT=mezarchy-terminal
